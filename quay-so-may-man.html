<style>
  :root { --primary:#d32f2f; --bg:#fff5f5; --text:#222; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  form { background:var(--card); width:100%; max-width:360px; padding:28px 24px; border-radius:14px;
         box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 6px; font-size:22px; color:var(--primary); }
  p { margin:0 0 18px; font-size:14px; color:#666; }
  input[type=password] { width:100%; padding:12px 14px; font-size:16px; border:1px solid #ddd; border-radius:8px; }
  input[type=password]:focus { outline:2px solid var(--primary); border-color:transparent; }
  label { display:flex; gap:8px; align-items:center; margin:12px 0 16px; font-size:14px; color:#555; }
  button { width:100%; padding:12px; font-size:16px; font-weight:600; border:0; border-radius:8px;
           background:var(--primary); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:var(--primary); font-size:14px; min-height:20px; margin:10px 0 0; }
</style>

const STORE = "enc-key:" + P.s;
const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));

async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: u8(P.s), iterations: P.n, hash: "SHA-256" }, base, 256));
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.i) }, key, u8(P.c));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
function load() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
function save(raw) { try { localStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch (e) {} }
function forget() { try { localStorage.removeItem(STORE); } catch (e) {} }

(async () => {
  const saved = load();
  if (saved) {
    try { show(await decrypt(u8(saved))); return; } catch (e) { forget(); }
  }
})();

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Đang mở…"; err.textContent = "";
  try {
    const raw = await deriveRaw(document.getElementById("pw").value);
    const html = await decrypt(raw);
    if (document.getElementById("rm").checked) save(raw);
    show(html);
  } catch (e) {
    err.textContent = "Sai mật khẩu";
    btn.disabled = false; btn.textContent = "Mở";
  }
});
